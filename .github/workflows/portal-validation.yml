name: Portal Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate account portal and exact hosted artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate portal source and protocol
        shell: bash
        run: |
          set -euo pipefail
          node --check auth/app.js
          node --check auth/sync-key-flow.mjs
          node --test scripts/account-flow.test.mjs scripts/hosting-build.test.mjs scripts/sync-key-flow.test.mjs
          node scripts/check-site.mjs

      - name: Verify the exact staged hosting artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-hosting.mjs
          node scripts/verify-hosting-build.mjs --expected-source-sha "$GITHUB_SHA"
