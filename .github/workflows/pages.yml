name: Publish public website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate public pages
        run: |
          node --check auth/app.js
          node --test scripts/account-flow.test.mjs scripts/hosting-build.test.mjs
          node scripts/check-site.mjs
      - name: Stage public files
        run: |
          node scripts/stage-hosting.mjs
          node scripts/verify-hosting-build.mjs --expected-source-sha "$GITHUB_SHA"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .firebase-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
